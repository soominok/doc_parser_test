# ────────────────────────────────────────────────────────────────
# PDF → Markdown 하이브리드 파서 - Docker Compose
# ────────────────────────────────────────────────────────────────
#
# [기본 실행]
#   docker compose up --build
#   # 브라우저: http://localhost:7860
#
# [백그라운드 실행]
#   docker compose up -d --build
#
# [로그 확인]
#   docker compose logs -f
#
# [중지]
#   docker compose down
#
# [모델 캐시 포함 완전 초기화]
#   docker compose down -v
# ────────────────────────────────────────────────────────────────

services:
  pdf-parser:
    # ── 이미지 빌드 ───────────────────────────────────────────────
    build:
      context: .
      dockerfile: Dockerfile

    container_name: pdf-parser

    # ── 포트 포워딩 ───────────────────────────────────────────────
    # 호스트:컨테이너 형식
    # GRADIO_PORT 환경변수 변경 시 여기도 맞춰서 수정
    ports:
      - "7860:7860"

    # ── 환경변수 ─────────────────────────────────────────────────
    environment:
      # Docker 모드 플래그 (브라우저 자동 실행 비활성화)
      - DOCKER_ENV=true

      # Gradio 서버 설정
      - GRADIO_HOST=0.0.0.0
      - GRADIO_PORT=7860

      # 변환 결과 저장 경로 (아래 volumes와 연동)
      - OUTPUT_DIR=/app/output

      # [선택] LLM API Key를 환경변수로 주입할 경우 아래 주석 해제
      # - ANTHROPIC_API_KEY=sk-ant-...

    # ── 볼륨 마운트 ───────────────────────────────────────────────
    volumes:
      # 1. AI 모델 캐시 (named volume)
      #    - docling이 사용하는 HuggingFace 모델을 컨테이너 재시작 후에도 유지
      #    - 첫 실행 시 수백 MB 다운로드 → 이후 재다운로드 없이 빠르게 시작
      - model_cache:/root/.cache

      # 2. 변환 결과 출력 디렉토리 (호스트 bind mount)
      #    - 컨테이너 내 /app/output → 호스트 ./output 으로 파일 저장
      #    - ./output 폴더가 없으면 자동 생성
      - ./output:/app/output

    # ── 재시작 정책 ───────────────────────────────────────────────
    # 컨테이너가 비정상 종료되면 자동 재시작
    # (docker compose down 명령으로 수동 중지 시에는 재시작 안 함)
    restart: unless-stopped

    # ── 리소스 제한 (선택) ────────────────────────────────────────
    # docling의 AI 모델 추론은 메모리를 많이 사용합니다.
    # 서버 환경에 맞게 조정하세요.
    # deploy:
    #   resources:
    #     limits:
    #       memory: 4g
    #     reservations:
    #       memory: 2g

# ── Named Volumes ────────────────────────────────────────────────
volumes:
  # AI 모델 캐시 볼륨
  # - docker compose down 해도 유지됨 (재다운로드 방지)
  # - docker compose down -v 로 완전 삭제 가능
  model_cache:
    driver: local
