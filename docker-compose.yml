# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml
#
# 두 가지 실행 모드를 제공한다:
#
#   1. [parser] 배치 CLI 모드 - 볼륨 마운트된 PDF를 자동 변환
#      docker-compose run --rm parser
#      docker-compose run --rm parser --input /app/input/문서.pdf
#
#   2. [api] REST API 서버 모드 - PDF 업로드 → Markdown 반환
#      docker-compose up api
#      curl -X POST http://localhost:8000/parse -F "file=@문서.pdf"
#
# 사전 준비:
#   cp .env.example .env   # API 키 설정
#   mkdir -p ./data/input ./data/output ./data/models
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── 1. 배치 CLI 파서 ────────────────────────────────────────────────────────
  parser:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime              # 런타임 스테이지만 빌드
    image: pdf-parser:latest
    container_name: pdf-parser-cli

    # APP_MODE=cli → entrypoint가 main.py CLI를 실행
    environment:
      APP_MODE: "cli"
      INPUT_DIR: "/app/input"
      OUTPUT_DIR: "/app/output"
      DEBUG_DIR: "/app/debug"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LLM_PROVIDER: "${LLM_PROVIDER:-none}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-claude-opus-4-6}"
      # docling 모델 캐시 경로
      HF_HOME: "/app/models"
      DOCLING_ARTIFACTS_PATH: "/app/models"

    volumes:
      # 호스트 ./data/input → 컨테이너 /app/input (PDF 입력)
      - ./data/input:/app/input
      # 호스트 ./data/output → 컨테이너 /app/output (Markdown 출력)
      - ./data/output:/app/output
      # docling 모델 캐시를 영구 볼륨으로 유지 (재다운로드 방지)
      - pdf_parser_models:/app/models
      # 디버그 출력 (--debug 옵션 사용 시)
      - ./data/debug:/app/debug

    # 기본 커맨드: --input 은 환경변수 INPUT_DIR 을 사용 (entrypoint에서 처리)
    # 커맨드 오버라이드 예시:
    #   docker-compose run --rm parser --input /app/input/계약서.pdf --no-docling
    command: []

    # 메모리 제한 (docling 딥러닝 모델이 메모리를 많이 사용)
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G

    # GPU 사용 시 주석 해제 (NVIDIA Container Toolkit 필요)
    # runtime: nvidia
    # environment:
    #   NVIDIA_VISIBLE_DEVICES: all
    #   DOCLING_USE_GPU: "true"

  # ── 2. REST API 서버 ────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: pdf-parser:latest
    container_name: pdf-parser-api

    environment:
      APP_MODE: "api"
      API_PORT: "8000"
      INPUT_DIR: "/app/input"
      OUTPUT_DIR: "/app/output"
      DEBUG_DIR: "/app/debug"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LLM_PROVIDER: "${LLM_PROVIDER:-none}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-claude-opus-4-6}"
      HF_HOME: "/app/models"
      DOCLING_ARTIFACTS_PATH: "/app/models"
      # 업로드 임시 파일 저장 경로
      UPLOAD_TMP_DIR: "/app/input/tmp"

    ports:
      - "${API_HOST_PORT:-8000}:8000"

    volumes:
      - ./data/input:/app/input
      - ./data/output:/app/output
      - pdf_parser_models:/app/models
      - ./data/debug:/app/debug

    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G

    # /health 엔드포인트로 헬스체크
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s          # docling 모델 로딩 시간 고려

    restart: unless-stopped

# ── 명명된 볼륨 ──────────────────────────────────────────────────────────────
volumes:
  # docling HuggingFace 모델 캐시 (~1GB)
  # 컨테이너를 재시작해도 모델을 재다운로드하지 않음
  pdf_parser_models:
    driver: local
